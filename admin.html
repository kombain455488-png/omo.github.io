<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Админ-панель</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 40px auto; padding: 20px; background: #f5f6fa; }
        h1 { color: #333; border-bottom: 2px solid #667eea; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th { background: #667eea; color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f8f9fa; }
        .stats { display: flex; gap: 20px; margin: 20px 0; flex-wrap: wrap; }
        .stat { background: white; padding: 20px 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); flex: 1; min-width: 150px; text-align: center; }
        .stat span { font-size: 32px; font-weight: bold; color: #667eea; display: block; margin-top: 5px; }
        .stat .label { color: #666; font-size: 14px; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 40px auto; }
        .login-box input { display: block; width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; }
        .login-box button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        .login-box button:hover { background: #5a6fd6; }
        .error { color: #e74c3c; margin: 10px 0; }
        #content { display: none; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; background: #27ae60; color: white; }
    </style>
</head>
<body>
    <h1>📊 Админ-панель мессенджера</h1>
    
    <div id="login-box" class="login-box">
        <h2>🔐 Вход для администратора</h2>
        <p style="color:#666;font-size:14px;">Войдите как <strong>admin</strong></p>
        <input type="text" id="admin-user" placeholder="Логин" value="admin">
        <input type="password" id="admin-pass" placeholder="Пароль">
        <div id="error-msg" class="error"></div>
        <button onclick="loginAdmin()">Войти</button>
    </div>
    
    <div id="content">
        <div class="stats">
            <div class="stat"><span id="user-count">0</span><div class="label">👥 Пользователей</div></div>
            <div class="stat"><span id="chat-count">0</span><div class="label">💬 Чатов</div></div>
            <div class="stat"><span id="msg-count">0</span><div class="label">📩 Сообщений</div></div>
        </div>
        
        <h2>👥 Все пользователи</h2>
        <div style="overflow-x:auto;">
            <table>
                <thead><tr><th>#</th><th>Логин</th><th>Дата регистрации</th></tr></thead>
                <tbody id="users-table"></tbody>
            </table>
        </div>
        
        <h2>💬 Все чаты</h2>
        <div style="overflow-x:auto;">
            <table>
                <thead><tr><th>#</th><th>Название</th><th>Создатель</th><th>Дата</th></tr></thead>
                <tbody id="chats-table"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Адрес сервера (замените на ваш, если нужно)
        const SERVER_URL = 'https://messenger-4lye.onrender.com';

        async function loginAdmin() {
            const username = document.getElementById('admin-user').value;
            const password = document.getElementById('admin-pass').value;
            const errorMsg = document.getElementById('error-msg');
            errorMsg.textContent = '';
            
            try {
                const res = await fetch(SERVER_URL + '/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                    credentials: 'include'
                });
                
                const data = await res.json();
                if (data.success) {
                    document.getElementById('login-box').style.display = 'none';
                    document.getElementById('content').style.display = 'block';
                    loadData();
                } else {
                    errorMsg.textContent = '❌ ' + (data.error || 'Ошибка входа');
                }
            } catch {
                errorMsg.textContent = '❌ Не удалось подключиться к серверу';
            }
        }
        
        async function loadData() {
            try {
                const res = await fetch(SERVER_URL + '/api/admin/users', { 
                    credentials: 'include' 
                });
                if (!res.ok) throw new Error('Нет доступа');
                
                const data = await res.json();
                
                document.getElementById('user-count').textContent = data.users.length;
                document.getElementById('chat-count').textContent = data.chats.length;
                document.getElementById('msg-count').textContent = data.total_messages;
                
                // Пользователи
                const usersTable = document.getElementById('users-table');
                usersTable.innerHTML = '';
                if (data.users.length === 0) {
                    usersTable.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#999;">Нет пользователей</td></tr>';
                }
                data.users.forEach((user, i) => {
                    const date = user.created_at ? new Date(user.created_at * 1000).toLocaleString() : '—';
                    usersTable.innerHTML += `
                        <tr>
                            <td>${i + 1}</td>
                            <td>@${user.username}</td>
                            <td>${date}</td>
                        </tr>
                    `;
                });
                
                // Чаты
                const chatsTable = document.getElementById('chats-table');
                chatsTable.innerHTML = '';
                if (data.chats.length === 0) {
                    chatsTable.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#999;">Нет чатов</td></tr>';
                }
                data.chats.forEach((chat, i) => {
                    const date = chat.created_at ? new Date(chat.created_at * 1000).toLocaleString() : '—';
                    chatsTable.innerHTML += `
                        <tr>
                            <td>${i + 1}</td>
                            <td>${chat.name}</td>
                            <td>@${chat.creator}</td>
                            <td>${date}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                alert('Ошибка загрузки данных: ' + err.message);
            }
        }
        
        // Проверяем, есть ли уже сессия
        fetch(SERVER_URL + '/api/me', { credentials: 'include' })
            .then(res => res.json())
            .then(data => {
                if (data.username === 'admin') {
                    document.getElementById('login-box').style.display = 'none';
                    document.getElementById('content').style.display = 'block';
                    loadData();
                }
            })
            .catch(() => {});
    </script>
</body>
</html>
