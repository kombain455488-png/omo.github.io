<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мессенджер</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- СТРАНИЦА ВХОДА -->
    <div id="auth-page">
        <div class="auth-container">
            <h1>📱 Мессенджер</h1>
            <div id="auth-error" class="error-message"></div>
            
            <div id="login-form">
                <h2>Вход</h2>
                <input type="text" id="login-username" placeholder="Логин">
                <input type="password" id="login-password" placeholder="Пароль">
                <button id="login-btn">Войти</button>
                <p>Нет аккаунта? <a href="#" id="show-register">Зарегистрироваться</a></p>
            </div>
            
            <div id="register-form" style="display:none">
                <h2>Регистрация</h2>
                <input type="text" id="register-username" placeholder="Логин">
                <input type="password" id="register-password" placeholder="Пароль">
                <button id="register-btn">Зарегистрироваться</button>
                <p>Уже есть аккаунт? <a href="#" id="show-login">Войти</a></p>
            </div>
        </div>
    </div>

    <!-- СТРАНИЦА ЧАТА -->
    <div id="chat-page" style="display:none">
        <div id="chat-container">
            <!-- Список чатов -->



            <!-- Список чатов -->
            <div id="sidebar">
                <div class="sidebar-header">
                    <h3>💬 Чаты</h3>
                    <button id="new-chat-btn" class="btn-new-chat">+</button>
                </div>
                
                <!-- ПОИСК ПОЛЬЗОВАТЕЛЕЙ -->
                <div class="search-container">
                    <input type="text" id="search-users" placeholder="Поиск пользователей (например, @username)" class="search-input">
                    <div id="search-results" class="search-results"></div>
                </div>
                
                <div id="chat-list"></div>
                <div class="sidebar-footer">
                    <span id="current-user"></span>
                    <button id="logout-btn" class="btn-logout">🚪 Выйти</button>
                </div>
            </div>
    
                
            
            <!-- Область чата -->
            <div id="main-chat">
                <div id="chat-header">
                    <h2 id="chat-name">Выберите чат</h2>
                </div>
                <div id="messages"></div>
                <div id="input-area">
                    <input type="text" id="messageInput" placeholder="Введите сообщение...">
                    <button id="send-btn">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно создания чата -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2>Создать новый чат</h2>
            <input type="text" id="new-chat-name" placeholder="Название чата">
            <div class="modal-actions">
                <button id="create-chat-btn">Создать</button>
                <button id="modal-cancel-btn">Отмена</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
